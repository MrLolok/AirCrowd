services:
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    container_name: kafka
    networks:
      - aircrowd-network
    ports:
      - ${KAFKA_EXTERNAL_PORT}:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server :9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-setup:
    image: apache/kafka:latest
    hostname: kafka-setup
    container_name: kafka-setup
    networks:
      - aircrowd-network
    volumes:
      - ./kafka-init.sh:/usr/bin/kafka-init.sh
    depends_on:
      kafka:
        condition: service_healthy
    command: [ "sh", "-c", "/usr/bin/kafka-init.sh" ]

  redis:
    image: redis:7-alpine
    container_name: aircrowd-redis
    hostname: aircrowd-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - aircrowd-network
    volumes:
      - aircrowd-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  discovery-server:
    build:
      context: DiscoveryServer
      dockerfile: Dockerfile
    container_name: aircrowd-discovery-server
    hostname: aircrowd-discovery-server
    restart: always
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    environment:
      - EUREKA_HOSTNAME=aircrowd-discovery-server
    networks:
      - aircrowd-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  weather-service:
    build:
      context: Weather
      dockerfile: Dockerfile
    container_name: aircrowd-weather-service
    hostname: aircrowd-weather-service
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    volumes:
      - aircrowd-weather-service:/home/app/configs
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://aircrowd-discovery-service:8761/eureka/
      - REDIS_HOST=aircrowd-redis
      - REDIS_PORT=6379
    networks:
      aircrowd-network:

  airport-management-service:
    build:
      context: AirportManagement
      dockerfile: Dockerfile
    container_name: aircrowd-airport-management-service
    hostname: aircrowd-airport-management-service
    restart: always
    ports:
      - "${AIRPORT_MANAGEMENT_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://aircrowd-discovery-service:8761/eureka/
      - REDIS_HOST=aircrowd-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-aircrowd}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-aircrowd}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aircrowd123}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - aircrowd-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/airport-management/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  aircrowd-weather-service:
  aircrowd-redis-data:

networks:
  aircrowd-network:
    name: aircrowd-network
    driver: bridge